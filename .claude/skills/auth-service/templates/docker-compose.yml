# Stack de __BRAND__ — autenticación + panel de administración.
# Un solo compose: Postgres + Keycloak + la app web. `name` fija el
# nombre de proyecto, así no hace falta pasar `-p`.
name: __SLUG__

services:

  postgres:
    image: postgres:16
    container_name: __SLUG__-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: __SLUG__-keycloak
    restart: unless-stopped
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Emisor (iss) de los tokens fijo: así la app puede canjear el
      # refresh_token llamando por la red interna y el iss sigue coincidiendo.
      KC_HOSTNAME: http://localhost:__KC_PORT__
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "__KC_PORT__:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/__SLUG__:/opt/keycloak/themes/__SLUG__:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web-shell:
    build: ./web-shell
    container_name: __SLUG__-app
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "__WEB_PORT__:8000"
    # Código montado en vivo: editar plantillas/CSS -> recargar el navegador.
    # Editar app/main.py -> `docker compose restart web-shell`.
    volumes:
      - ./web-shell/app:/app/app
    depends_on: [keycloak]
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
