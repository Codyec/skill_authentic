services:

  demacya-app:
    build: .
    container_name: demacya-app
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    # Código montado en vivo: editar plantillas / CSS no requiere reconstruir
    # la imagen (Jinja relee las plantillas en cada request). Cambios en
    # main.py sí necesitan `docker compose restart`.
    volumes:
      - ./app:/app/app

    extra_hosts:
      - "host.docker.internal:host-gateway"